<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>灵感站 · 展陈形式灵感收集工作台</title>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
  <div class="app" id="app"></div>
  <script src="/js/api.js"></script>
  <script src="/js/add-modal.js"></script>
  <script>
    let state = {
      stats: null,
      categories: [],
      venueTypes: [],
      recent: [],
      pendingList: [],
    };

    document.getElementById('app').innerHTML = `
      ${renderSidebar('home')}
      <main class="main">
        <div class="hero" id="hero">
          <div class="hero-label">展陈形式灵感库</div>
          <div class="hero-title" id="hero-title">还没有灵感 ✨</div>
          <div class="hero-subtitle" id="hero-subtitle">用 iPhone 分享到「灵感站」快捷指令，开始收集你的第一个灵感</div>
          <button class="hero-add-btn" onclick="openAddModal()" aria-label="新灵感来啦">
            <span class="hero-add-icon">✨</span>
            <span class="hero-add-text">新灵感来啦</span>
          </button>
        </div>

        <div class="stats-grid" id="stats-grid">
          <div class="stat-card pink"><div class="stat-label">总灵感数</div><div class="stat-value" id="stat-total">0</div></div>
          <div class="stat-card yellow"><div class="stat-label">近 7 天新增</div><div class="stat-value" id="stat-7days">0</div></div>
          <div class="stat-card cyan"><div class="stat-label">待确认</div><div class="stat-value" id="stat-pending">0</div></div>
          <div class="stat-card purple"><div class="stat-label">已用</div><div class="stat-value" id="stat-used">0</div></div>
        </div>

        <div class="cards-grid">
          <div class="card-flat">
            <div class="section-header">
              <div>
                <div class="section-label">近 7 天</div>
                <div class="section-title">灵感新增趋势</div>
              </div>
            </div>
            <div id="trend-chart" style="height: 200px; display: flex; align-items: flex-end; gap: 8px; padding: 16px 0;"></div>
          </div>

          <div class="card-flat">
            <div class="section-header">
              <div>
                <div class="section-label">分类分布</div>
                <div class="section-title">形式小类一览</div>
              </div>
            </div>
            <div id="category-chart" style="padding: 8px 0;"></div>
          </div>
        </div>

        <div class="card-flat mt-6">
          <div class="section-header">
            <div>
              <div class="section-label">展馆分布</div>
              <div class="section-title">展馆类型统计</div>
            </div>
          </div>
          <div id="venue-chart" style="padding: 8px 0;"></div>
        </div>

        <div class="card-flat mt-6">
          <div class="section-header">
            <div>
              <div class="section-label">最近添加</div>
              <div class="section-title">刚收集的灵感</div>
            </div>
            <a href="/inspirations" class="section-link">查看全部 →</a>
          </div>
          <div id="recent-grid" class="inspirations-grid mt-4"></div>
        </div>
      </main>
    `;

    // 添加新灵感后：刷新首页数据（统计 + 最近灵感 + hero 文案）
    window.onInspirationAdded = async () => {
      try {
        const [statsRes, listRes, catRes] = await Promise.all([
          API.getStats(), API.listInspirations({}), API.getCategories()
        ]);
        if (statsRes.success) {
          state.stats = statsRes.stats;
          state.categories = statsRes.categories || state.categories;
          state.venueTypes = statsRes.venueTypes || state.venueTypes;
          renderStats();
        }
        if (listRes.success) {
          state.recent = listRes.inspirations.slice(0, 8);
          renderRecent();
        }
        if (catRes.success && !state.categories.length) {
          state.categories = catRes.categories;
          state.venueTypes = catRes.venueTypes || [];
        }
      } catch (e) {
        console.warn('Refresh after add failed:', e);
      }
    };

    // 加载数据
    Promise.all([API.getStats(), API.listInspirations({}), API.getCategories()])
      .then(([statsRes, listRes, catRes]) => {
        if (statsRes.success) {
          state.stats = statsRes.stats;
          state.categories = statsRes.categories || [];
          state.venueTypes = statsRes.venueTypes || [];
          renderStats();
        }
        if (listRes.success) {
          state.recent = listRes.inspirations.slice(0, 8);
          renderRecent();
        }
        if (catRes.success && !state.categories.length) {
          state.categories = catRes.categories;
          state.venueTypes = catRes.venueTypes || [];
        }
      })
      .catch(e => {
        if (e.message && e.message.includes('401')) {
          promptToken();
        } else {
          showToast('加载失败：' + e.message);
        }
      });

    function promptToken() {
      const t = prompt('请输入 API Token（在 Netlify 环境变量 API_TOKEN 中设置）：');
      if (t) {
        API.setToken(t);
        location.reload();
      }
    }

    function renderStats() {
      const s = state.stats;
      if (!s) return;
      document.getElementById('stat-total').textContent = s.total;
      document.getElementById('stat-7days').textContent = s.last7Days.reduce((a, b) => a + b.count, 0);
      document.getElementById('stat-pending').textContent = s.pendingConfirm;
      document.getElementById('stat-used').textContent = s.byStatus.used;

      // Hero
      const heroTitle = document.getElementById('hero-title');
      const heroSub = document.getElementById('hero-subtitle');
      if (s.total === 0) {
        heroTitle.textContent = '还没有灵感 ✨';
        heroSub.textContent = '用 iPhone 分享到「灵感站」快捷指令，开始收集你的第一个灵感';
      } else {
        heroTitle.textContent = `已收集 ${s.total} 条形式灵感`;
        const today = s.last7Days[s.last7Days.length - 1]?.count || 0;
        heroSub.textContent = today > 0
          ? `今天又攒了 ${today} 条，${s.pendingConfirm} 条待你确认 ✨`
          : `最近 7 天新增 ${s.last7Days.reduce((a, b) => a + b.count, 0)} 条，继续保持！`;
      }

      // 趋势图
      const max = Math.max(1, ...s.last7Days.map(d => d.count));
      const trendEl = document.getElementById('trend-chart');
      trendEl.innerHTML = s.last7Days.map(d => {
        const h = Math.max(8, (d.count / max) * 160);
        const day = new Date(d.date).toLocaleDateString('zh-CN', { weekday: 'short' });
        return `
          <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px;">
            <div style="font-size: 12px; font-weight: 700; color: var(--color-pink);">${d.count}</div>
            <div style="width: 100%; height: ${h}px; background: linear-gradient(180deg, var(--color-pink) 0%, var(--color-pink-soft) 100%); border-radius: 8px 8px 0 0; transition: all 0.3s;"></div>
            <div style="font-size: 11px; color: var(--color-text-soft);">${day}</div>
          </div>
        `;
      }).join('');

      // 形式小类分布
      const catEl = document.getElementById('category-chart');
      const total = s.total || 1;
      catEl.innerHTML = state.categories.map(c => {
        const count = s.byCategory[c.id] || 0;
        const pct = Math.round((count / total) * 100);
        return `
          <div style="margin-bottom: 14px;">
            <div class="flex-between" style="margin-bottom: 6px;">
              <span style="font-size: 14px; font-weight: 600;">
                <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${c.color};margin-right:8px;"></span>
                ${c.name}
              </span>
              <span style="font-size: 13px; color: var(--color-text-soft);">${count} 条 (${pct}%)</span>
            </div>
            <div style="height: 8px; background: #f0f0f0; border-radius: 4px; overflow: hidden;">
              <div style="width: ${pct}%; height: 100%; background: ${c.color}; border-radius: 4px; transition: width 0.5s;"></div>
            </div>
          </div>
        `;
      }).join('');

      // 展馆类型分布
      const venueEl = document.getElementById('venue-chart');
      if (venueEl && state.venueTypes.length > 0) {
        venueEl.innerHTML = state.venueTypes.map(v => {
          const count = (s.byVenueType && s.byVenueType[v.id]) || 0;
          const pct = Math.round((count / total) * 100);
          return `
            <div style="margin-bottom: 14px;">
              <div class="flex-between" style="margin-bottom: 6px;">
                <span style="font-size: 14px; font-weight: 600;">
                  <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${v.color};margin-right:8px;"></span>
                  ${v.name}
                </span>
                <span style="font-size: 13px; color: var(--color-text-soft);">${count} 条 (${pct}%)</span>
              </div>
              <div style="height: 8px; background: #f0f0f0; border-radius: 4px; overflow: hidden;">
                <div style="width: ${pct}%; height: 100%; background: ${v.color}; border-radius: 4px; transition: width 0.5s;"></div>
              </div>
            </div>
          `;
        }).join('');
      }
    }

    function renderRecent() {
      const el = document.getElementById('recent-grid');
      if (state.recent.length === 0) {
        el.innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center; padding: 40px 0; color: var(--color-text-soft);">
            <div style="font-size: 48px; margin-bottom: 12px;">🌱</div>
            <div style="font-size: 15px; font-weight: 600; margin-bottom: 6px;">还没有灵感</div>
            <div style="font-size: 13px;">在 iPhone 刷到好的展陈形式，分享到「灵感站」快捷指令即可</div>
          </div>
        `;
        return;
      }
      el.innerHTML = state.recent.map(insp => renderInspirationCard(insp)).join('');
    }

    function renderInspirationCard(insp) {
      // 形式小类（多选）—— 每条灵感可能 1-3 个小类，每个都显示一个 tag
      const catIds = insp.subCategories || insp.aiSuggestion?.subCategories || (insp.subCategory ? [insp.subCategory] : (insp.aiSuggestion?.subCategory ? [insp.aiSuggestion.subCategory] : []));
      const catNames = insp.subCategoryNames || insp.aiSuggestion?.subCategoryNames || (insp.subCategoryName ? [insp.subCategoryName] : (insp.aiSuggestion?.subCategoryName ? [insp.aiSuggestion.subCategoryName] : []));
      const catTags = catIds.length > 0
        ? catIds.map((id, i) => {
            const c = getCategoryColor(state.categories, id);
            const n = catNames[i] || id;
            return `<span class="tag" style="background: ${c}22; color: ${c};">${escapeHtml(n)}</span>`;
          }).join('')
        : `<span class="tag tag-default">待 AI</span>`;
      const venue = insp.venueType || insp.aiSuggestion?.venueType;
      const venueName = insp.venueTypeName || insp.aiSuggestion?.venueTypeName;
      const venueColor = venue ? getCategoryColor(state.venueTypes, venue) : '#999';
      const conf = insp.aiSuggestion?.confidence;
      const confTag = conf !== undefined
        ? (conf >= 70
            ? `<span class="tag tag-confidence-high">AI ${conf}%</span>`
            : conf >= 40
              ? `<span class="tag" style="background: #FFF8E1; color: #F57C00;">AI ${conf}%</span>`
              : `<span class="tag tag-confidence-low">AI ${conf}% 待确认</span>`)
        : '';

      const cover = insp.coverImage
        ? `<img class="insp-cover" src="${escapeHtml(insp.coverImage)}" alt="" loading="lazy" onerror="this.outerHTML='<div class=&quot;insp-cover-placeholder&quot;>图片加载失败</div>'">`
        : `<div class="insp-cover-placeholder">⏳ 抓取中...</div>`;

      return `
        <a class="insp-card" href="/inspirations?id=${insp.id}">
          ${cover}
          <div class="insp-body">
            <div class="insp-title" data-title="${escapeHtml(insp.title || '无标题')}" onclick="startEditTitle('${insp.id}', this, event, onHomeTitleSaved)" title="点击修改标题">${escapeHtml(insp.title || '无标题')}</div>
            <div class="insp-meta">
              ${catTags}
              ${venueName ? `<span class="tag" style="background: ${venueColor}22; color: ${venueColor};">${escapeHtml(venueName)}</span>` : ''}
              <span class="tag tag-status-${insp.status}">${STATUS_LABEL[insp.status] || insp.status}</span>
              ${confTag}
            </div>
          </div>
        </a>
      `;
    }

    function onHomeTitleSaved(id, newTitle) {
      const insp = state.recent.find(i => i.id === id);
      if (insp) insp.title = newTitle;
    }
  </script>
</body>
</html>

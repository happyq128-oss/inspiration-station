<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>灵感库 · 灵感站</title>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
  <div class="app" id="app"></div>
  <script src="/js/api.js"></script>
  <script src="/js/add-modal.js"></script>
  <script>
    const urlParams = new URLSearchParams(location.search);
    const focusId = urlParams.get('id');
    const initialStatus = urlParams.get('status') || '';
    const initialCategory = urlParams.get('subCategory') || '';

    let state = {
      categories: [],
      venueTypes: [],
      inspirations: [],
      filter: {
        status: initialStatus,
        subCategory: initialCategory,
        venueType: '',
        platform: '',
        keyword: '',
        startDate: '',
        endDate: '',
      },
      view: 'grid', // 'grid' | 'list'
      selected: new Set(),
    };

    document.getElementById('app').innerHTML = `
      ${renderSidebar('list')}
      <main class="main">
        <div class="page-header">
          <div>
            <h1 class="page-title">灵感库</h1>
            <div class="page-subtitle" id="result-count">加载中...</div>
          </div>
          <div class="flex gap-2">
            <button class="btn btn-cyan" onclick="exportExcel()">📊 导出 Excel</button>
            <button class="btn btn-yellow" onclick="openAddModal()">+ 新灵感来啦</button>
          </div>
        </div>

        <!-- 批量 AI 整理工具栏（仅显示真的"待 AI 整理"的，AI 已跑过的另算） -->
        <div id="batch-toolbar" style="display: none; background: #FFF3E0; border: 2px solid #FF9800; border-radius: 12px; padding: 16px; margin-bottom: 16px; align-items: center; justify-content: space-between;">
          <div>
            <div style="font-weight: 600; color: #E65100; font-size: 15px;">🪄 <span id="batch-pending-count">0</span> 条灵感待 AI 整理</div>
            <div style="font-size: 12px; color: #5D4037; margin-top: 4px;">这些还没被 AI 看过，点按钮让 AI 给个分类建议（每条约 3-5 秒）</div>
          </div>
          <button class="btn" style="background: #FF9800; color: white; font-weight: 600;" onclick="batchClassifyAll()">🪄 一键 AI 整理</button>
        </div>

        <!-- "待你确认"工具栏：AI 已跑过、等你手动确认的 -->
        <div id="review-toolbar" style="display: none; background: #E0F7F5; border: 2px solid #4ECDC4; border-radius: 12px; padding: 16px; margin-bottom: 16px; align-items: center; justify-content: space-between;">
          <div>
            <div style="font-weight: 600; color: #00695C; font-size: 15px;">🤖 <span id="review-count">0</span> 条灵感 AI 已建议，等你确认</div>
            <div style="font-size: 12px; color: #004D40; margin-top: 4px;">AI 已经给过分类了，进来确认或改一下就变"已整理"</div>
          </div>
          <button class="btn" style="background: #4ECDC4; color: white; font-weight: 600;" onclick="goToBatchReview()">批量确认 (4 条/批) →</button>
        </div>

        <!-- AI 误标修复工具栏（只有存在 AI 误标时才显示） -->
        <div id="reset-toolbar" style="display: none; background: #FFEBEE; border: 2px solid #EF5350; border-radius: 12px; padding: 16px; margin-bottom: 16px; align-items: center; justify-content: space-between;">
          <div>
            <div style="font-weight: 600; color: #C62828; font-size: 15px;">⚠️ 检测到 <span id="reset-bad-count">0</span> 条灵感被 AI 误标为"已整理"</div>
            <div style="font-size: 12px; color: #5D4037; margin-top: 4px;">之前 AI 整理完会自动改成"已整理"，现在改成需要你手动确认。点下面按钮一键回退到"待整理"。</div>
          </div>
          <button class="btn" style="background: #EF5350; color: white; font-weight: 600;" onclick="resetBadStatus()">🔄 一键重置</button>
        </div>

        <!-- 学习规则清理工具栏（只有存在 rules 时才显示） -->
        <div id="rules-toolbar" style="display: none; background: #F3E5F5; border: 2px solid #9C27B0; border-radius: 12px; padding: 16px; margin-bottom: 16px; align-items: center; justify-content: space-between;">
          <div>
            <div style="font-weight: 600; color: #6A1B9A; font-size: 15px;">🧹 小类库累积了 <span id="rules-total">0</span> 条学习规则，其中 <span id="rules-bug">0</span> 条疑似旧 bug 规则</div>
            <div style="font-size: 12px; color: #4A148C; margin-top: 4px;">这些规则是 AI 根据你之前的修正自动累积的。点下面按钮按需清理——清理后 AI 会从干净状态重新学习。</div>
          </div>
          <div style="display: flex; gap: 8px; align-items: center;">
            <button class="btn btn-sm" style="background: #AB47BC; color: white; font-weight: 600;" onclick="resetRulesAction('bug')">🧹 只清疑似 bug</button>
            <button class="btn btn-sm" style="background: #6A1B9A; color: white; font-weight: 600;" onclick="resetRulesAction('all')">清空所有</button>
          </div>
        </div>

        <div class="toolbar">
          <input class="search-box" placeholder="🔍 搜索标题 / 描述 / My idea / 标签 / AI 视觉描述..." id="search-box" />
          <!-- 日期范围 popover -->
          <div style="position: relative;">
            <button class="filter-pill" id="date-btn" onclick="toggleDatePanel(event)" type="button">📅 <span id="date-summary">日期范围</span></button>
            <div id="date-panel" style="display: none; position: absolute; top: calc(100% + 4px); left: 0; z-index: 100; background: white; border: 1px solid #ddd; border-radius: 12px; padding: 14px; min-width: 360px; box-shadow: 0 8px 24px rgba(0,0,0,0.12);">
              <div style="display: flex; gap: 8px; align-items: center; margin-bottom: 12px;">
                <input type="date" id="date-start" class="form-input" style="flex: 1;" title="开始日期" onchange="onDateInputChange()">
                <span class="text-soft">→</span>
                <input type="date" id="date-end" class="form-input" style="flex: 1;" title="结束日期" onchange="onDateInputChange()">
              </div>
              <div style="display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px;">
                <button class="filter-pill" data-shortcut="today" type="button" onclick="setDateShortcut('today')">今天</button>
                <button class="filter-pill" data-shortcut="7days" type="button" onclick="setDateShortcut('7days')">最近 7 天</button>
                <button class="filter-pill" data-shortcut="30days" type="button" onclick="setDateShortcut('30days')">最近 30 天</button>
                <button class="filter-pill" data-shortcut="month" type="button" onclick="setDateShortcut('month')">本月</button>
                <button class="filter-pill" data-shortcut="all" type="button" onclick="setDateShortcut('all')">全部时间</button>
              </div>
              <div style="display: flex; gap: 8px; justify-content: flex-end; border-top: 1px solid #eee; padding-top: 10px;">
                <button class="btn btn-ghost btn-sm" type="button" onclick="clearDateFilter()">清除</button>
                <button class="btn btn-primary btn-sm" type="button" onclick="applyDateFilter()">应用筛选</button>
              </div>
              <div class="text-mute" style="font-size: 11px; margin-top: 8px;">💡 灵感超过 200 条时分批导出，避免单次 6MB 上限</div>
            </div>
          </div>
          <div id="filter-status" style="display: flex; gap: 6px;"></div>
          <div class="view-toggle">
            <button data-view="grid" class="active" onclick="switchView('grid')">▦ 卡片</button>
            <button data-view="list" onclick="switchView('list')">≡ 列表</button>
          </div>
        </div>

        <div class="toolbar" id="filter-row-2" style="margin-top: -8px;">
          <div id="filter-platform" style="display: flex; gap: 6px;"></div>
          <div id="filter-category" style="display: flex; gap: 6px; flex-wrap: wrap;"></div>
          <div id="filter-venue" style="display: flex; gap: 6px; flex-wrap: wrap;"></div>
          <div id="batch-bar" style="display: none; margin-left: auto; gap: 8px; align-items: center;">
            <span class="text-soft" id="selected-count">0 项已选</span>
            <button class="btn btn-sm btn-ghost" onclick="batchAction('organized')">标记已整理</button>
            <button class="btn btn-sm btn-ghost" onclick="batchAction('used')">标记已用</button>
            <button class="btn btn-sm btn-ghost" onclick="openBatchCategory()">改小类</button>
            <button class="btn btn-sm" style="background: #ffebee; color: #c62828;" onclick="batchDelete()">删除</button>
          </div>
        </div>

        <div class="inspirations-grid" id="grid-view"></div>
        <div class="inspirations-list" id="list-view">
          <div class="insp-row" style="font-weight: 700; background: transparent; border: none; color: var(--color-text-soft); font-size: 12px; cursor: default;">
            <div></div><div>标题</div><div>小类</div><div>状态</div><div>平台</div><div>时间</div>
          </div>
          <div id="list-rows"></div>
        </div>
      </main>
    `;

    // 状态筛选
    const statuses = [
      { value: '', label: '全部' },
      { value: 'pending', label: '待整理' },
      { value: 'organized', label: '已整理' },
      { value: 'used', label: '已用' },
    ];
    document.getElementById('filter-status').innerHTML = statuses.map(s =>
      `<button class="filter-pill ${state.filter.status === s.value ? 'active' : ''}" data-status="${s.value}">${s.label}</button>`
    ).join('');

    // 平台筛选
    const platforms = [
      { value: '', label: '全平台' },
      { value: 'xiaohongshu', label: '小红书' },
      { value: 'douyin', label: '抖音' },
      { value: 'huaban', label: '花瓣' },
      { value: 'other', label: '其他' },
    ];
    document.getElementById('filter-platform').innerHTML = platforms.map(p =>
      `<button class="filter-pill ${state.filter.platform === p.value ? 'active' : ''}" data-platform="${p.value}">${p.label}</button>`
    ).join('');

    // 事件
    document.getElementById('search-box').addEventListener('input', e => {
      state.filter.keyword = e.target.value;
      loadList();
    });
    document.getElementById('filter-status').addEventListener('click', e => {
      const btn = e.target.closest('button');
      if (!btn) return;
      state.filter.status = btn.dataset.status;
      document.querySelectorAll('#filter-status .filter-pill').forEach(b => b.classList.toggle('active', b === btn));
      loadList();
    });
    document.getElementById('filter-platform').addEventListener('click', e => {
      const btn = e.target.closest('button');
      if (!btn) return;
      state.filter.platform = btn.dataset.platform;
      document.querySelectorAll('#filter-platform .filter-pill').forEach(b => b.classList.toggle('active', b === btn));
      loadList();
    });

    // 加载分类 + 列表
    Promise.all([API.getCategories(), API.listInspirations({})])
      .then(([catRes, listRes]) => {
        if (catRes.success) {
          state.categories = catRes.categories;
          state.venueTypes = catRes.venueTypes || [];
          renderCategoryFilter();
          renderVenueTypeFilter();
        }
        if (listRes.success) {
          state.inspirations = listRes.inspirations;
          renderList();
          // 检测是否有 AI 误标的"已整理"（status=organized 但没 confirmedAt）
          checkBadStatus();
          // 检测分类里累积的"学习规则"
          checkRules();
        }
      })
      .catch(e => {
        if (e.message && e.message.includes('401')) {
          const t = prompt('请输入 API Token：');
          if (t) { API.setToken(t); location.reload(); }
        } else {
          showToast('加载失败：' + e.message);
        }
      });

    // 检测 AI 误标的灵感（status=organized 但没 confirmedAt）
    async function checkBadStatus() {
      try {
        const res = await API.resetBadStatus(true); // dryRun
        if (res.success && res.resetCount > 0) {
          const toolbar = document.getElementById('reset-toolbar');
          if (toolbar) {
            toolbar.style.display = 'flex';
            document.getElementById('reset-bad-count').textContent = res.resetCount;
          }
        }
      } catch (e) {
        console.warn('Check bad status failed:', e);
      }
    }

    // 一键重置误标
    async function resetBadStatus() {
      if (!confirm('将把 AI 误标的"已整理"（没经过你确认的）全部重置为"待整理"。\n\n⚠️ 已经是"已用"的不会被影响。\n\n确定执行？')) return;
      const btn = event.target;
      const oldText = btn.textContent;
      btn.disabled = true;
      btn.textContent = '重置中...';
      try {
        const res = await API.resetBadStatus(false);
        if (res.success) {
          showToast(`✓ 已重置 ${res.resetCount} 条`, 2500);
          // 隐藏工具栏，刷新列表
          const toolbar = document.getElementById('reset-toolbar');
          if (toolbar) toolbar.style.display = 'none';
          loadList();
        } else {
          showToast('重置失败：' + (res.error || ''), 4000);
          btn.disabled = false;
          btn.textContent = oldText;
        }
      } catch (e) {
        showToast('重置失败：' + (e.message || '网络错误'), 4000);
        btn.disabled = false;
        btn.textContent = oldText;
      }
    }

    // 检测分类里累积的"学习规则"——dryRun 拿统计
    async function checkRules() {
      try {
        const res = await API.resetRules('bug', true); // dryRun
        if (res.success && res.totalRules > 0) {
          const toolbar = document.getElementById('rules-toolbar');
          if (toolbar) {
            toolbar.style.display = 'flex';
            document.getElementById('rules-total').textContent = res.totalRules;
            document.getElementById('rules-bug').textContent = res.bugRules;
          }
        }
      } catch (e) {
        console.warn('Check rules failed:', e);
      }
    }

    // 清理规则
    async function resetRulesAction(mode) {
      const isAll = mode === 'all';
      const confirmMsg = isAll
        ? '⚠️ 将清空所有学习规则（共 14 条左右）。\n\n• 疑似 bug 规则（基于"待整理/加载中..."等占位标题的）会被清掉\n• 你之前手动的有效规则也会被清掉\n\n清空后 AI 从干净状态重新学习，确定？'
        : '将只清掉疑似 bug 规则（基于"待整理/加载中..."等占位标题的），保留你手动的有效规则。\n\n确定执行？';
      if (!confirm(confirmMsg)) return;
      const btn = event.target;
      const oldText = btn.textContent;
      btn.disabled = true;
      btn.textContent = '清理中...';
      try {
        const res = await API.resetRules(mode, false);
        if (res.success) {
          if (res.clearedRules > 0) {
            showToast(`✓ 已清掉 ${res.clearedRules} 条规则`, 2500);
          } else {
            showToast('没有需要清掉的规则', 2500);
          }
          // 重新检测（如果清完了就自动隐藏）
          await checkRules();
        } else {
          showToast('清理失败：' + (res.error || ''), 4000);
          btn.disabled = false;
          btn.textContent = oldText;
        }
      } catch (e) {
        showToast('清理失败：' + (e.message || '网络错误'), 4000);
        btn.disabled = false;
        btn.textContent = oldText;
      }
    }

    function renderCategoryFilter() {
      const el = document.getElementById('filter-category');
      el.innerHTML = state.categories.map(c =>
        `<button class="filter-pill ${state.filter.subCategory === c.id ? 'active' : ''}" data-cat="${c.id}" style="--c: ${c.color}; ${state.filter.subCategory === c.id ? `background:${c.color};color:#fff;border-color:${c.color};` : ''}">
          <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${c.color};margin-right:6px;"></span>${c.name}
        </button>`
      ).join('');
      // 移除旧 listener 用 event delegation 一次性绑
      el.onclick = e => {
        const btn = e.target.closest('button');
        if (!btn) return;
        state.filter.subCategory = state.filter.subCategory === btn.dataset.cat ? '' : btn.dataset.cat;
        renderCategoryFilter();
        loadList();
      };
    }

    function renderVenueTypeFilter() {
      const el = document.getElementById('filter-venue');
      if (!el) return;
      el.innerHTML = state.venueTypes.map(v =>
        `<button class="filter-pill ${state.filter.venueType === v.id ? 'active' : ''}" data-venue="${v.id}" style="${state.filter.venueType === v.id ? `background:${v.color};color:#fff;border-color:${v.color};` : ''}">
          <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${v.color};margin-right:6px;"></span>${v.name}
        </button>`
      ).join('');
      el.onclick = e => {
        const btn = e.target.closest('button');
        if (!btn) return;
        state.filter.venueType = state.filter.venueType === btn.dataset.venue ? '' : btn.dataset.venue;
        renderVenueTypeFilter();
        loadList();
      };
    }

    function loadList() {
      API.listInspirations({
        status: state.filter.status,
        subCategory: state.filter.subCategory,
        venueType: state.filter.venueType,
        platform: state.filter.platform,
        keyword: state.filter.keyword,
        startDate: state.filter.startDate,
        endDate: state.filter.endDate,
      }).then(res => {
        if (res.success) {
          state.inspirations = res.inspirations;
          renderList();
        }
      });
    }

    function renderList() {
      const total = state.inspirations.length;
      document.getElementById('result-count').textContent = total > 0 ? `共 ${total} 条灵感` : '还没有匹配的灵感';

      // 区分两类 pending：
      //   - 待 AI 整理：status=pending 且还没 AI 跑过（!aiSuggestion）
      //   - 待你确认：status=pending 且 AI 已跑过（aiSuggestion.confidence>0）
      const pendingAI = state.inspirations.filter(i =>
        i.status === 'pending' && (!i.aiSuggestion || (i.aiSuggestion.confidence || 0) === 0)
      );
      const pendingReview = state.inspirations.filter(i =>
        i.status === 'pending' && i.aiSuggestion && (i.aiSuggestion.confidence || 0) > 0
      );

      const batchToolbar = document.getElementById('batch-toolbar');
      if (batchToolbar) {
        batchToolbar.style.display = pendingAI.length > 0 ? 'flex' : 'none';
        document.getElementById('batch-pending-count').textContent = pendingAI.length;
      }

      const reviewToolbar = document.getElementById('review-toolbar');
      if (reviewToolbar) {
        reviewToolbar.style.display = pendingReview.length > 0 ? 'flex' : 'none';
        document.getElementById('review-count').textContent = pendingReview.length;
      }

      const gridEl = document.getElementById('grid-view');
      const listEl = document.getElementById('list-rows');

      if (total === 0) {
        gridEl.innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: var(--color-text-soft);">
            <div style="font-size: 56px; margin-bottom: 12px;">🔍</div>
            <div style="font-size: 16px; font-weight: 600;">没有匹配的灵感</div>
            <div style="font-size: 13px; margin-top: 6px;">试试调整筛选条件，或者去 iPhone 分享几条进来 ✨</div>
          </div>
        `;
        listEl.innerHTML = '';
        return;
      }

      gridEl.innerHTML = state.inspirations.map(insp => renderInspirationCard(insp)).join('');
      listEl.innerHTML = state.inspirations.map(insp => renderInspirationRow(insp)).join('');

      // 焦点高亮
      if (focusId) {
        setTimeout(() => {
          const el = document.querySelector(`[data-id="${focusId}"]`);
          if (el) {
            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            el.style.outline = '3px solid var(--color-pink)';
            el.style.outlineOffset = '2px';
            setTimeout(() => { el.style.outline = ''; el.style.outlineOffset = ''; }, 2500);
          }
        }, 100);
      }
    }

    // 跳到批量确认页
    function goToBatchReview() {
      const pending = state.inspirations.filter(i =>
        i.status === 'pending' && i.aiSuggestion && (i.aiSuggestion.confidence || 0) > 0
      );
      if (pending.length === 0) {
        showToast('没有待确认的灵感了');
        return;
      }
      location.href = '/confirm-batch';
    }

    // 渲染本地路径标签：💻 硬盘 — 点击在 Finder 中显示（如果本地服务在线）
    function renderLocalPathTag(localPath) {
      const safe = escapeHtml(localPath);
      return `<a class="tag tag-default tag-link local-path-tag"
                href="javascript:void(0)"
                onclick="event.stopPropagation(); handleRevealLocal('${safe.replace(/'/g, "\\'")}')"
                title="本地路径：${safe}（点击在 Finder 中显示，未启动本地服务时复制路径）"
                style="font-size: 12px; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                💻 硬盘
              </a>`;
    }

    async function handleRevealLocal(localPath) {
      if (!localPath) return;
      // 尝试调本地服务
      const r = await API.revealLocalPath(localPath);
      if (r.ok) {
        showToast('✓ 已在 Finder 中显示', 2000);
        return;
      }
      // 失败时降级：复制路径到剪贴板
      try {
        await navigator.clipboard.writeText(localPath);
        showToast('本地服务未启动，路径已复制到剪贴板', 3000);
      } catch {
        showToast('本地服务未启动，路径：' + localPath, 5000);
      }
    }

    function renderInspirationCard(insp) {
      // 形式小类（多选）
      const catIds = insp.subCategories || (insp.aiSuggestion?.subCategories) || (insp.subCategory ? [insp.subCategory] : (insp.aiSuggestion?.subCategory ? [insp.aiSuggestion.subCategory] : []));
      const catNames = insp.subCategoryNames || (insp.aiSuggestion?.subCategoryNames) || (insp.subCategoryName ? [insp.subCategoryName] : (insp.aiSuggestion?.subCategoryName ? [insp.aiSuggestion.subCategoryName] : []));
      const catTags = catIds.map((id, i) => {
        const color = getCategoryColor(state.categories, id);
        return `<span class="tag" style="background: ${color}22; color: ${color};">${escapeHtml(catNames[i] || id)}</span>`;
      }).join('');
      const venue = insp.venueType || insp.aiSuggestion?.venueType;
      const venueName = insp.venueTypeName || insp.aiSuggestion?.venueTypeName;
      const venueColor = getCategoryColor(state.venueTypes, venue);
      const conf = insp.aiSuggestion?.confidence;
      const confTag = conf !== undefined
        ? (conf >= 70
            ? `<span class="tag tag-confidence-high">AI ${conf}%</span>`
            : conf >= 40
              ? `<span class="tag" style="background: #FFF8E1; color: #F57C00;">AI ${conf}%</span>`
              : `<span class="tag tag-confidence-low">⚠ AI ${conf}%</span>`)
        : `<span class="tag tag-default">待 AI</span>`;

      const cover = insp.coverImage
        ? `<img class="insp-cover" src="${escapeHtml(insp.coverImage)}" alt="" loading="lazy" onerror="this.outerHTML='<div class=&quot;insp-cover-placeholder&quot;>图片加载失败</div>'">`
        : `<div class="insp-cover-placeholder">⏳ 抓取中</div>`;

      const checked = state.selected.has(insp.id) ? 'checked' : '';
      const checkedStyle = state.selected.has(insp.id) ? 'outline: 3px solid var(--color-pink);' : '';

      return `
        <div class="insp-card" data-id="${insp.id}" style="${checkedStyle}; position: relative;" onclick="openInspiration('${insp.id}')">
          <input type="checkbox" ${checked} onclick="event.stopPropagation(); toggleSelect('${insp.id}', this.checked)" style="position: absolute; top: 10px; left: 10px; width: 20px; height: 20px; z-index: 10; cursor: pointer; accent-color: var(--color-pink);">
          ${cover}
          <div class="insp-body">
            <div class="insp-title" data-title="${escapeHtml(insp.title || '无标题')}" onclick="startEditTitle('${insp.id}', this, event, onTitleSaved)" title="点击修改标题">${escapeHtml(insp.title || '无标题')}</div>
            <div class="insp-myidea" data-myidea="${escapeHtml(buildMyIdea(insp))}" onclick="startEditMyIdea('${insp.id}', this, event, onMyIdeaSaved)" title="点击记录你的想法（My idea）" style="font-size: 12px; color: #666; margin-top: 4px; line-height: 1.5; cursor: text; min-height: 18px;">
              ${(() => {
                const mi = buildMyIdea(insp);
                if (!mi) return '<span style="color: #bbb;">+ My idea</span>';
                return '💡 ' + escapeHtml(mi.length > 80 ? mi.slice(0, 80) + '...' : mi);
              })()}
            </div>
            <div class="insp-meta">
              ${catTags || '<span class="tag tag-default">待分类</span>'}
              ${venueName ? `<span class="tag" style="background: ${venueColor}22; color: ${venueColor};">${escapeHtml(venueName)}</span>` : ''}
              <span class="tag tag-status-${insp.status}">${STATUS_LABEL[insp.status]}</span>
              ${confTag}
            </div>
            <div class="insp-meta" style="margin-top: 8px;">
              ${(() => {
                // 硬盘图不显示 platform（没平台概念）
                if (insp.localPath || insp.source === 'local') return '';
                const platformLabel = PLATFORM_LABEL[insp.platform] || insp.platform || '';
                const hasUrl = insp.url && insp.url.startsWith('http');
                if (hasUrl) {
                  return `<a class="tag tag-default tag-link" href="${escapeHtml(insp.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="打开原帖">${escapeHtml(platformLabel)}</a>`;
                }
                return platformLabel ? `<span class="tag tag-default">${escapeHtml(platformLabel)}</span>` : '';
              })()}
              ${insp.localPath ? renderLocalPathTag(insp.localPath) : ''}
              <span class="text-mute" style="font-size: 11px;">${formatDate(insp.createdAt)}</span>
            </div>
          </div>
        </div>
      `;
    }

    // 构造 My idea 字符串：tags + 换行 + userNote
    function buildMyIdea(insp) {
      const tags = (insp.tags || []).join(' ');
      const note = insp.userNote || '';
      return [tags, note].filter(Boolean).join('\n').trim();
    }

    // My idea 标题保存后回调
    function onMyIdeaSaved(id, newText) {
      const insp = state.inspirations.find(i => i.id === id);
      if (!insp) return;
      const lines = newText.split('\n');
      const tags = lines[0].trim().split(/\s+/).filter(Boolean);
      const userNote = lines.slice(1).join('\n').trim();
      insp.tags = tags;
      insp.userNote = userNote;
    }

    // 点击 My idea 行就地编辑
    async function startEditMyIdea(id, el, e, onSaved) {
      if (e) { e.stopPropagation(); e.preventDefault(); }
      if (el.getAttribute('contenteditable') === 'true') return;
      const originalHtml = el.innerHTML;
      const current = (el.dataset.myidea || el.textContent || '').trim();
      el.setAttribute('contenteditable', 'true');
      el.textContent = current;
      el.style.background = '#fffbf0';
      el.style.borderRadius = '6px';
      el.style.padding = '4px 6px';
      el.style.outline = '1px solid #FFD93D';

      const range = document.createRange();
      range.selectNodeContents(el);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);

      let finished = false;
      const restore = () => {
        el.removeAttribute('contenteditable');
        el.style.background = '';
        el.style.borderRadius = '';
        el.style.padding = '';
        el.style.outline = '';
        el.innerHTML = originalHtml;
      };
      const save = async () => {
        if (finished) return;
        finished = true;
        const newText = (el.textContent || '').trim();
        el.removeAttribute('contenteditable');
        el.style.background = '';
        el.style.borderRadius = '';
        el.style.padding = '';
        el.style.outline = '';
        if (newText === current) { el.innerHTML = originalHtml; return; }
        try {
          // 拆 tags + userNote
          const lines = newText.split('\n');
          const tags = lines[0].trim().split(/\s+/).filter(Boolean);
          const userNote = lines.slice(1).join('\n').trim();
          const res = await API.updateInspiration(id, { tags, userNote });
          if (res.success) {
            el.dataset.myidea = newText;
            const insp = state.inspirations.find(i => i.id === id);
            if (insp) { insp.tags = tags; insp.userNote = userNote; }
            if (typeof onSaved === 'function') onSaved(id, newText);
            const displayText = newText.length > 80 ? newText.slice(0, 80) + '...' : newText;
            el.innerHTML = newText ? '💡 ' + escapeHtml(displayText) : '<span style="color: #bbb;">+ My idea</span>';
            showToast('✓ My idea 已保存', 1200);
          } else {
            showToast('保存失败：' + (res.error || ''), 3000);
            el.innerHTML = originalHtml;
          }
        } catch (err) {
          showToast('保存失败：' + (err.message || '网络错误'), 3000);
          el.innerHTML = originalHtml;
        }
      };
      const cancel = () => { if (finished) return; finished = true; restore(); };
      el.addEventListener('blur', () => setTimeout(save, 100), { once: true });
      el.addEventListener('keydown', (ev) => {
        ev.stopPropagation();
        if (ev.key === 'Enter' && !ev.shiftKey) {
          // Enter 直接保存（Shift+Enter 换行）
          ev.preventDefault();
          el.blur();
        } else if (ev.key === 'Escape') {
          ev.preventDefault();
          cancel();
        }
      });
    }

    /** 标题更新后回调：同步到 state */
    function onTitleSaved(id, newTitle) {
      const insp = state.inspirations.find(i => i.id === id);
      if (insp) insp.title = newTitle;
    }

    function renderInspirationRow(insp) {
      const cat = insp.subCategory || insp.aiSuggestion?.subCategory;
      const catName = insp.subCategoryName || insp.aiSuggestion?.subCategoryName || '待分类';
      const catColor = getCategoryColor(state.categories, cat);
      const venue = insp.venueType || insp.aiSuggestion?.venueType;
      const venueName = insp.venueTypeName || insp.aiSuggestion?.venueTypeName;
      const venueColor = getCategoryColor(state.venueTypes, venue);
      const checked = state.selected.has(insp.id) ? 'checked' : '';

      const cover = insp.coverImage
        ? `<img class="insp-row-cover" src="${escapeHtml(insp.coverImage)}" loading="lazy">`
        : `<div class="insp-row-cover" style="display:flex;align-items:center;justify-content:center;color:#999;font-size:11px;">无</div>`;

      return `
        <div class="insp-row" data-id="${insp.id}" onclick="openInspiration('${insp.id}')">
          <div style="position: relative;">
            <input type="checkbox" ${checked} onclick="event.stopPropagation(); toggleSelect('${insp.id}', this.checked)" style="position: absolute; top: -8px; left: -8px; z-index: 10; accent-color: var(--color-pink);">
            ${cover}
          </div>
          <div>
            <div class="insp-title" data-title="${escapeHtml(insp.title || '无标题')}" style="font-size: 14px;" onclick="startEditTitle('${insp.id}', this, event, onTitleSaved)" title="点击修改标题">${escapeHtml(insp.title || '无标题')}</div>
            <div class="insp-myidea" data-myidea="${escapeHtml(buildMyIdea(insp))}" onclick="startEditMyIdea('${insp.id}', this, event, onMyIdeaSaved)" title="点击记录你的想法（My idea）" style="font-size: 11px; color: #888; margin-top: 2px; line-height: 1.4; cursor: text;">
              ${(() => {
                const mi = buildMyIdea(insp);
                if (!mi) return '<span style="color: #ccc;">+ My idea</span>';
                return '💡 ' + escapeHtml(mi.length > 60 ? mi.slice(0, 60) + '...' : mi);
              })()}
            </div>
          </div>
          <div>
            <span class="tag" style="background: ${catColor}22; color: ${catColor};">${escapeHtml(catName)}</span>
            ${venueName ? `<span class="tag" style="background: ${venueColor}22; color: ${venueColor}; margin-left:4px;">${escapeHtml(venueName)}</span>` : ''}
          </div>
          <div><span class="tag tag-status-${insp.status}">${STATUS_LABEL[insp.status]}</span></div>
          <div>
            ${(() => {
              // 硬盘图不显示 platform
              if (insp.localPath || insp.source === 'local') {
                return insp.localPath ? renderLocalPathTag(insp.localPath) : '';
              }
              const platformLabel = PLATFORM_LABEL[insp.platform] || insp.platform || '';
              const hasUrl = insp.url && insp.url.startsWith('http');
              if (hasUrl) {
                return `<a class="tag tag-default tag-link" href="${escapeHtml(insp.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="打开原帖" style="font-size: 13px;">${escapeHtml(platformLabel)}</a>`;
              }
              return platformLabel ? `<span class="tag tag-default" style="font-size: 13px;">${escapeHtml(platformLabel)}</span>` : '';
            })()}
            ${insp.localPath ? renderLocalPathTag(insp.localPath) : ''}
          </div>
          <div class="text-soft" style="font-size: 12px;">${formatDate(insp.createdAt)}</div>
        </div>
      `;
    }

    function switchView(v) {
      state.view = v;
      document.querySelectorAll('.view-toggle button').forEach(b => b.classList.toggle('active', b.dataset.view === v));
      document.getElementById('grid-view').classList.toggle('hidden', v !== 'grid');
      document.getElementById('list-view').classList.toggle('active', v === 'list');
    }

    function toggleSelect(id, checked) {
      if (checked) state.selected.add(id);
      else state.selected.delete(id);
      updateBatchBar();
      // 重新渲染选中样式
      document.querySelectorAll(`[data-id="${id}"]`).forEach(el => {
        el.style.outline = checked ? '3px solid var(--color-pink)' : '';
        el.style.outlineOffset = checked ? '2px' : '';
      });
    }

    function updateBatchBar() {
      const bar = document.getElementById('batch-bar');
      const cnt = state.selected.size;
      bar.style.display = cnt > 0 ? 'flex' : 'none';
      document.getElementById('selected-count').textContent = `${cnt} 项已选`;
    }

    async function batchAction(status) {
      if (!confirm(`将 ${state.selected.size} 条灵感标记为「${STATUS_LABEL[status]}」？`)) return;
      const promises = [...state.selected].map(id => API.updateInspiration(id, { status }));
      await Promise.all(promises);
      showToast('已更新');
      state.selected.clear();
      updateBatchBar();
      loadList();
    }

    /**
     * 一键批量 AI 整理所有"待 AI 整理"的灵感（已 AI 跑过的跳过）
     */
    async function batchClassifyAll() {
      const pendingAI = state.inspirations.filter(i =>
        i.status === 'pending' && (!i.aiSuggestion || (i.aiSuggestion.confidence || 0) === 0)
      );
      if (pendingAI.length === 0) {
        showToast('没有待 AI 整理的灵感（已 AI 跑过的请到"待你确认"工具栏处理）');
        return;
      }
      const total = pendingAI.length;
      const perItem = 4; // 每条约 4 秒
      if (!confirm(`将分批调用 AI 整理 ${total} 条灵感（每条约 ${perItem} 秒，共约 ${total * perItem} 秒）。\n\n⚠️ 已 AI 跑过但没确认的不会被重复跑。`)) return;

      const btn = event.target;
      const oldText = btn.textContent;
      btn.disabled = true;

      let totalSuccess = 0;
      let totalFailed = 0;
      const allFailed = [];

      try {
        let safetyCounter = 0;
        while (safetyCounter < 100) {
          safetyCounter++;
          btn.textContent = `🪄 整理中 ${totalSuccess}/${total}`;

          const res = await API.batchClassify({ all: true, limit: 1 });
          console.log(`Batch #${safetyCounter} result:`, res);

          totalSuccess += res.successCount || 0;
          if (res.failed) {
            totalFailed += res.failed.length;
            allFailed.push(...res.failed);
          }

          if (!res.hasMore) break;
        }

        if (totalFailed > 0) {
          alert(`🎉 成功整理 ${totalSuccess} 条\n❌ 失败 ${totalFailed} 条\n\n失败的可能是因为图触发 Qwen 内容审核，可以单独处理。`);
        } else if (totalSuccess > 0) {
          showToast(`🎉 全部 ${totalSuccess} 条已 AI 整理（记得去"待你确认"过一遍）`, 3000);
        } else {
          showToast('没有可整理的灵感', 2500);
        }
      } catch (e) {
        console.error('Batch classify error:', e);
        alert('批量整理出错：' + e.message + `\n\n已整理 ${totalSuccess} 条，剩余 ${totalFailed} 条失败。`);
      } finally {
        btn.disabled = false;
        btn.textContent = oldText;
        loadList();
      }
    }

    /**
     * 单条 AI 整理（在 confirm.html 用）
     */
    async function classifyOne(id) {
      if (!confirm('将调用 AI 整理这条灵感（3-5秒）？')) return;
      try {
        const res = await API.reclassify(id);
        if (res.success) {
          showToast('🪄 AI 整理完成');
          loadList();
        }
      } catch (e) {
        alert('AI 整理失败：' + e.message);
      }
    }

    async function batchDelete() {
      if (!confirm(`确定删除 ${state.selected.size} 条灵感？此操作不可恢复。`)) return;
      await API.deleteInspirations([...state.selected]);
      showToast('已删除');
      state.selected.clear();
      updateBatchBar();
      loadList();
    }

    function openBatchCategory() {
      const html = `
        <div class="modal-mask show" id="batch-cat-modal">
          <div class="modal" style="max-width: 400px;">
            <div class="modal-header">
              <div class="modal-title">批量改小类</div>
              <button class="modal-close" onclick="document.getElementById('batch-cat-modal').remove()">✕</button>
            </div>
            <div class="modal-body">
              <div class="form-group">
                <label class="form-label">选择新小类</label>
                <select class="form-select" id="batch-cat-select">
                  <option value="">未分类</option>
                  ${state.categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}
                </select>
              </div>
            </div>
            <div class="modal-footer">
              <button class="btn btn-ghost" onclick="document.getElementById('batch-cat-modal').remove()">取消</button>
              <button class="btn btn-primary" onclick="confirmBatchCategory()">确定</button>
            </div>
          </div>
        </div>
      `;
      document.body.insertAdjacentHTML('beforeend', html);
    }

    async function confirmBatchCategory() {
      const catId = document.getElementById('batch-cat-select').value;
      const promises = [...state.selected].map(id => API.updateInspiration(id, { subCategory: catId || undefined, status: 'organized' }));
      await Promise.all(promises);
      showToast('已更新');
      document.getElementById('batch-cat-modal').remove();
      state.selected.clear();
      updateBatchBar();
      loadList();
    }

    function exportExcel() {
      const params = {};
      if (state.filter.status) params.status = state.filter.status;
      if (state.filter.subCategory) params.subCategory = state.filter.subCategory;
      if (state.filter.startDate) params.startDate = state.filter.startDate;
      if (state.filter.endDate) params.endDate = state.filter.endDate;
      // 估算数量
      const count = state.inspirations.length;
      const dateNote = (state.filter.startDate || state.filter.endDate)
        ? `（${state.filter.startDate || '不限'} → ${state.filter.endDate || '不限'}）`
        : '';
      if (!confirm(`将导出 ${count} 条灵感${dateNote}。\n\n继续？`)) return;
      API.exportExcel(params);
    }

    // ============ 日期范围 popover ============
    function toggleDatePanel(e) {
      if (e) e.stopPropagation();
      const panel = document.getElementById('date-panel');
      if (!panel) return;
      const isOpen = panel.style.display === 'block';
      panel.style.display = isOpen ? 'none' : 'block';
      if (!isOpen) {
        // 同步 input 显示
        document.getElementById('date-start').value = state.filter.startDate || '';
        document.getElementById('date-end').value = state.filter.endDate || '';
        highlightActiveShortcut();
        // 点外面关闭
        setTimeout(() => {
          document.addEventListener('click', closeDatePanelOutside, { once: true });
        }, 0);
      }
    }

    function closeDatePanelOutside(e) {
      const panel = document.getElementById('date-panel');
      const btn = document.getElementById('date-btn');
      if (panel && !panel.contains(e.target) && e.target !== btn && !btn.contains(e.target)) {
        panel.style.display = 'none';
      } else {
        // 还是没关，再绑一次
        document.addEventListener('click', closeDatePanelOutside, { once: true });
      }
    }

    function onDateInputChange() {
      // 实时更新 state，但不立刻触发 loadList（点"应用"才触发）
      // 这样用户输入错了不会立刻清空列表
      const s = document.getElementById('date-start').value;
      const e = document.getElementById('date-end').value;
      document.querySelectorAll('[data-shortcut]').forEach(b => b.classList.remove('active'));
    }

    function setDateShortcut(kind) {
      const today = new Date();
      const fmt = (d) => d.toISOString().slice(0, 10);
      const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
      const startInput = document.getElementById('date-start');
      const endInput = document.getElementById('date-end');
      document.querySelectorAll('[data-shortcut]').forEach(b => b.classList.toggle('active', b.dataset.shortcut === kind));
      if (kind === 'all') {
        startInput.value = '';
        endInput.value = '';
      } else if (kind === 'today') {
        startInput.value = fmt(today);
        endInput.value = fmt(today);
      } else if (kind === '7days') {
        startInput.value = fmt(addDays(today, -6));
        endInput.value = fmt(today);
      } else if (kind === '30days') {
        startInput.value = fmt(addDays(today, -29));
        endInput.value = fmt(today);
      } else if (kind === 'month') {
        const first = new Date(today.getFullYear(), today.getMonth(), 1);
        startInput.value = fmt(first);
        endInput.value = fmt(today);
      }
    }

    function applyDateFilter() {
      const s = document.getElementById('date-start').value;
      const e = document.getElementById('date-end').value;
      // 校验：开始 > 结束 时自动交换
      let startDate = s, endDate = e;
      if (s && e && s > e) { startDate = e; endDate = s; }
      state.filter.startDate = startDate;
      state.filter.endDate = endDate;
      updateDateSummary();
      document.getElementById('date-panel').style.display = 'none';
      loadList();
    }

    function clearDateFilter() {
      state.filter.startDate = '';
      state.filter.endDate = '';
      document.getElementById('date-start').value = '';
      document.getElementById('date-end').value = '';
      document.querySelectorAll('[data-shortcut]').forEach(b => b.classList.remove('active'));
      updateDateSummary();
      document.getElementById('date-panel').style.display = 'none';
      loadList();
    }

    function updateDateSummary() {
      const el = document.getElementById('date-summary');
      if (!el) return;
      const s = state.filter.startDate, e = state.filter.endDate;
      if (!s && !e) el.textContent = '日期范围';
      else if (s && e) el.textContent = `${s.slice(5)} → ${e.slice(5)}`;
      else if (s) el.textContent = `${s.slice(5)} 起`;
      else el.textContent = `至 ${e.slice(5)}`;
    }

    function highlightActiveShortcut() {
      const s = state.filter.startDate, e = state.filter.endDate;
      const today = new Date().toISOString().slice(0, 10);
      const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x.toISOString().slice(0, 10); };
      const monthFirst = (() => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1).toISOString().slice(0, 10); })();
      let active = '';
      if (!s && !e) active = 'all';
      else if (s === today && e === today) active = 'today';
      else if (s === addDays(today, -6) && e === today) active = '7days';
      else if (s === addDays(today, -29) && e === today) active = '30days';
      else if (s === monthFirst && e === today) active = 'month';
      document.querySelectorAll('[data-shortcut]').forEach(b => b.classList.toggle('active', b.dataset.shortcut === active));
    }

    function openInspiration(id) {
      location.href = '/confirm?id=' + id;
    }

    // 手动添加弹窗的函数（openAddModal / closeAddModal / handleAddImage / submitAdd 等）
    // 都在 src/js/add-modal.js 里。submitAdd 成功后会自动调用 window.onInspirationAdded
    // 回调（如果页面有定义），这样每个页面都能自定义"添加后做什么"。
    // 灵感库页：添加成功后刷新列表
    window.onInspirationAdded = () => { loadList(); };
  </script>
</body>
</html>

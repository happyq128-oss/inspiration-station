<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>确认灵感 · 灵感站</title>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
  <div class="app" id="app"></div>
  <script src="/js/api.js"></script>
  <script>
    const urlParams = new URLSearchParams(location.search);
    const id = urlParams.get('id');

    let insp = null;
    let categories = [];
    let venueTypes = [];

    if (!id) {
      document.getElementById('app').innerHTML = `
        ${renderSidebar('list')}
        <main class="main">
          <div style="text-align: center; padding: 80px 20px;">
            <div style="font-size: 48px;">😶</div>
            <div class="mt-4 text-soft">没有指定灵感 ID</div>
            <a href="/inspirations" class="btn btn-primary mt-4">返回灵感库</a>
          </div>
        </main>
      `;
    } else {
      loadInspiration();
    }

    async function loadInspiration() {
      try {
        const res = await API.listInspirations({});
        if (!res.success) {
          throw new Error(res.error || '加载失败');
        }
        insp = res.inspirations.find(i => i.id === id);
        const catRes = await API.getCategories();
        if (catRes.success) {
          categories = catRes.categories || [];
          venueTypes = catRes.venueTypes || [];
        }
        if (!insp) {
          document.getElementById('app').innerHTML = `
            ${renderSidebar('list')}
            <main class="main">
              <div style="text-align: center; padding: 80px 20px;">
                <div style="font-size: 48px;">🔍</div>
                <div class="mt-4 text-soft">找不到这条灵感</div>
                <a href="/inspirations" class="btn btn-primary mt-4">返回灵感库</a>
              </div>
            </main>
          `;
          return;
        }
        render();
      } catch (e) {
        document.getElementById('app').innerHTML = `
          ${renderSidebar('list')}
          <main class="main">
            <div style="text-align: center; padding: 80px 20px;">
              <div style="font-size: 48px;">⚠️</div>
              <div class="mt-4 text-soft">加载失败：${escapeHtml(e.message || '')}</div>
              <a href="/inspirations" class="btn btn-primary mt-4">返回灵感库</a>
            </div>
          </main>
        `;
      }
    }

    function render() {
      const ai = insp.aiSuggestion;
      // 兼容：老数据 subCategory（单数）转成数组
      const aiSubCatIds = ai?.subCategories || (ai?.subCategory ? [ai.subCategory] : []);
      // 从 localPath 提取父目录名（硬盘图显示用）
      const parentDir = insp.localPath ? (insp.localPath.split('/').filter(Boolean).slice(-2, -1)[0] || '') : '';
      const aiSubCatNames = ai?.subCategoryNames || (ai?.subCategoryName ? [ai.subCategoryName] : []);
      const aiVenueId = ai?.venueType || '';
      const aiVenueName = ai?.venueTypeName || '';
      const catIds = insp.subCategories || (insp.subCategory ? [insp.subCategory] : []);
      const catNames = insp.subCategoryNames || (insp.subCategoryName ? [insp.subCategoryName] : []);
      const venueId = insp.venueType || '';

      document.getElementById('app').innerHTML = `
        ${renderSidebar('list')}
        <main class="main" style="max-width: 900px;">
          <div class="page-header">
            <a href="/inspirations" class="text-soft" style="font-size: 14px;">← 返回灵感库</a>
          </div>

          <div class="card-flat">
            ${insp.coverImage
              ? `<img src="${escapeHtml(insp.coverImage)}" style="width: 100%; max-height: 400px; object-fit: cover; border-radius: 12px; margin-bottom: 20px;" onerror="this.style.display='none'">`
              : `<div style="width: 100%; height: 200px; background: #f5f5f5; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #999; margin-bottom: 20px;">封面图加载中或暂无</div>`}

            <h1 class="insp-title" data-title="${escapeHtml(insp.title || '无标题')}"
                onclick="startEditTitle('${insp.id}', this, event, onConfirmTitleSaved)"
                title="点击修改标题"
                style="font-size: 22px; font-weight: 800; line-height: 1.4; letter-spacing: -0.3px;">
              ${escapeHtml(insp.title || '无标题')}
            </h1>

            <div class="insp-meta mt-4">
              ${catNames.map((n, i) => {
                const c = getCategoryColor(categories, catIds[i]);
                return `<span class="tag" style="background: ${c}22; color: ${c};">${escapeHtml(n)}</span>`;
              }).join('')}
              ${venueId ? `<span class="tag" style="background: ${getCategoryColor(venueTypes, venueId)}22; color: ${getCategoryColor(venueTypes, venueId)};">${escapeHtml(insp.venueTypeName || '')}</span>` : ''}
              <span class="tag tag-status-${insp.status}">${STATUS_LABEL[insp.status] || insp.status}</span>
              ${(() => {
                const platformLabel = PLATFORM_LABEL[insp.platform] || insp.platform || '';
                const hasUrl = insp.url && insp.url.startsWith('http');
                if (hasUrl) {
                  return `<a class="tag tag-default tag-link" href="${escapeHtml(insp.url)}" target="_blank" rel="noopener" title="打开原帖">${escapeHtml(platformLabel)}</a>`;
                }
                return `<span class="tag tag-default">${escapeHtml(platformLabel)}</span>`;
              })()}
              ${insp.localPath ? renderConfirmLocalTag(insp.localPath) : ''}
              <span class="text-mute" style="font-size: 12px;">${formatDate(insp.createdAt)}</span>
            </div>

            ${insp.description ? `<p class="mt-4 text-soft" style="font-size: 14px; line-height: 1.7;">${escapeHtml(insp.description)}</p>` : ''}

            <div class="mt-4">
              <button class="btn btn-ghost btn-sm" onclick="rescrape()">🔄 重新抓取</button>
              <button class="btn btn-ghost btn-sm" onclick="reclassify()">🤖 重新 AI 分类</button>
            </div>
          </div>

          ${ai ? `
            <div class="ai-suggestion mt-6">
              <div class="ai-suggestion-header">
                <div class="ai-label">🤖 AI 预归类</div>
                <span class="text-bold" style="color: var(--color-pink); font-size: 16px;">${ai.confidence}%</span>
              </div>
              <div style="font-size: 14px; line-height: 1.6;">
                AI 建议归类为
                <strong>${escapeHtml(aiSubCatNames.join(' + ') || '未分类')}</strong>
                ${aiVenueName ? ` · <strong>${escapeHtml(aiVenueName)}</strong>` : ''}
                ${ai.reasoning ? `<div class="mt-2 text-soft" style="font-size: 13px;">💡 ${escapeHtml(ai.reasoning)}</div>` : ''}
              </div>
              <div class="confidence-bar"><div style="width: ${ai.confidence}%; background: ${ai.confidence >= 70 ? 'var(--color-cyan)' : ai.confidence >= 40 ? '#FFA726' : '#FF6B6B'};"></div></div>
              ${ai.confidence < 60 ? `<div class="mt-2 text-soft" style="font-size: 12px;">⚠️ AI 把握不大，建议你确认或修正</div>` : ''}
            </div>
          ` : ''}

          <div class="card-flat mt-6">
            <h2 style="font-size: 16px; font-weight: 700; margin-bottom: 16px;">确认 / 修正分类</h2>

            <div class="form-group">
              <label class="form-label">形式小类 <span class="text-mute" style="font-weight: normal;">（可多选）</span></label>
              <div id="cat-options" style="display: flex; gap: 10px; flex-wrap: wrap;"></div>
            </div>

            <div class="form-group">
              <label class="form-label">展馆类型</label>
              <div id="venue-options" style="display: flex; gap: 10px; flex-wrap: wrap;"></div>
            </div>

            <div class="form-group">
              <label class="form-label">
                My idea
                <span class="text-mute" style="font-weight: normal;">— 你的想法、参考角度、补充标签（用空格分隔），都写这里</span>
              </label>
              <textarea class="form-textarea" id="my-idea-input" rows="4" placeholder="比如：抗战主题 / 装置艺术 / 沉浸式体验&#10;红+黑配色，墙面用老照片+油画混排...&#10;可参考新四军纪念馆的做法">${escapeHtml(((insp.tags || []).join(' ') + (insp.userNote ? (insp.tags?.length ? '\n' : '') + insp.userNote : '')).trim())}</textarea>
            </div>

            <div class="form-group">
              <label class="form-label">状态</label>
              <div style="display: flex; gap: 8px;">
                ${(() => {
                  // 默认状态：
                  //   - 当前是 pending → 默认 organized（打开 = 手动整理过）
                  //   - 其他 → 保持现状
                  const defaultStatus = insp.status === 'pending' ? 'organized' : insp.status;
                  return `
                    <button class="filter-pill status-btn ${defaultStatus === 'pending' ? 'active' : ''}" data-status="pending">待整理</button>
                    <button class="filter-pill status-btn ${defaultStatus === 'organized' ? 'active' : ''}" data-status="organized">已整理</button>
                    <button class="filter-pill status-btn ${defaultStatus === 'used' ? 'active' : ''}" data-status="used">已用</button>
                  `;
                })()}
              </div>
              ${insp.status === 'pending' ? `<div class="text-mute" style="font-size: 11px; margin-top: 6px;">💡 第一次保存 = 标记为"已整理"（你想留"待整理"再点回去）</div>` : ''}
            </div>

            ${insp.source === 'local' || insp.localPath ? `
            <!-- 硬盘图：只显示硬盘路径输入框 -->
            <div class="form-group">
              <label class="form-label">
                硬盘路径
                <span class="text-mute" style="font-weight: normal;">— 来自 Finder 选图，可在 Finder 中显示</span>
              </label>
              <div style="display: flex; gap: 6px; align-items: center;">
                <input class="form-input" id="local-path-input" value="${escapeHtml(insp.localPath || '')}" placeholder="/Users/你的用户名/Documents/展陈灵感/某图.jpg" style="font-family: monospace; font-size: 13px; flex: 1;">
                <button class="btn btn-cyan btn-sm" type="button" onclick="handleRevealLocal(document.getElementById('local-path-input').value)" title="在 Finder 中显示">📂 Finder</button>
                <button class="btn btn-sm" type="button" onclick="navigator.clipboard.writeText(document.getElementById('local-path-input').value).then(() => showToast('已复制', 1500))" style="background: #f0f0f0;">📋 复制</button>
                <button class="btn btn-sm" type="button" onclick="document.getElementById('local-path-input').value=''; showToast('已清空硬盘路径', 1500)" style="background: #fff3e0; color: #e65100;">🗑 清空</button>
              </div>
              <div class="text-mute" style="font-size: 11px; margin-top: 4px;">💡 标题已从父目录自动生成（<b>${escapeHtml(parentDir || '无')}</b>），可以改</div>
            </div>
            ` : `
            <!-- 线上图：只显示线上链接输入框 -->
            <div class="form-group">
              <label class="form-label">
                线上链接
                <span class="text-mute" style="font-weight: normal;">— 小红书 / 抖音 / 花瓣原帖等</span>
              </label>
              <div style="display: flex; gap: 6px; align-items: center;">
                <input class="form-input" id="url-input" value="${escapeHtml(insp.url && insp.url.startsWith('http') ? insp.url : '')}" placeholder="https://www.xiaohongshu.com/explore/..." style="font-size: 13px; flex: 1;">
                <button class="btn btn-sm" type="button" onclick="navigator.clipboard.writeText(document.getElementById('url-input').value).then(() => showToast('已复制', 1500))" style="background: #f0f0f0;">📋 复制</button>
                <button class="btn btn-sm" type="button" onclick="document.getElementById('url-input').value=''; showToast('已清空线上链接', 1500)" style="background: #fff3e0; color: #e65100;">🗑 清空</button>
              </div>
            </div>
            `}

            <div class="flex gap-2 mt-6">
              <button class="btn btn-primary btn-lg" onclick="saveAll()" id="save-btn">✓ 保存</button>
              <button class="btn btn-ghost" onclick="location.href='/inspirations'">取消</button>
              <button class="btn" style="background: #ffebee; color: #c62828; margin-left: auto;" onclick="deleteInspiration()">🗑 删除</button>
            </div>
          </div>
        </main>
      `;

      // 渲染小类选项（多选复选框）
      const catOptEl = document.getElementById('cat-options');
      catOptEl.innerHTML = categories.map(c => {
        const checked = catIds.includes(c.id);
        const bg = checked ? c.color : 'white';
        const fg = checked ? 'white' : '#333';
        const borderColor = checked ? c.color : '#ddd';
        const dotBg = checked ? 'white' : c.color;
        return `<label class="cat-option ${checked ? 'active' : ''}" data-cat="${c.id}" style="
          display: inline-flex; align-items: center; padding: 6px 12px; margin: 4px;
          border: 2px solid ${borderColor};
          border-radius: 16px; cursor: pointer; font-size: 13px;
          background: ${bg};
          color: ${fg};
          transition: all 0.15s;
        ">
          <input type="checkbox" data-cat="${c.id}" ${checked ? 'checked' : ''} style="margin-right: 6px;">
          <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${dotBg};margin-right:6px;"></span>${escapeHtml(c.name)}
        </label>`;
      }).join('');

      // 渲染展馆类型选项（单选按钮）
      const venueOptEl = document.getElementById('venue-options');
      venueOptEl.innerHTML = `
        <button class="filter-pill venue-option ${!venueId ? 'active' : ''}" data-venue="" type="button">未指定</button>
      ` + venueTypes.map(v => {
        const active = venueId === v.id;
        const bg = active ? v.color : '';
        const fg = active ? '#fff' : '';
        const borderColor = active ? v.color : '';
        return `<button class="filter-pill venue-option ${active ? 'active' : ''}" data-venue="${v.id}" type="button" style="${active ? `background:${v.color};color:#fff;border-color:${v.color};` : ''}">
          <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${v.color};margin-right:6px;"></span>${escapeHtml(v.name)}
        </button>`;
      }).join('');

      // 小类点击（多选）
      catOptEl.addEventListener('click', e => {
        const label = e.target.closest('label');
        if (!label) return;
        e.preventDefault();
        const checkbox = label.querySelector('input[type=checkbox]');
        const catId = label.dataset.cat;
        const colorSpan = label.querySelector('span');
        const colorVal = colorSpan.style.background;
        // 真正"切换"——强制以点击结果为准（避免 label 内部点击事件与原生 checkbox 行为冲突）
        const willCheck = !checkbox.checked;
        checkbox.checked = willCheck;
        if (willCheck) {
          label.classList.add('active');
          // 取分类颜色：从 options 里再查一次更稳
          const cat = categories.find(c => c.id === catId);
          if (cat) {
            label.style.background = cat.color;
            label.style.color = 'white';
            label.style.borderColor = cat.color;
            colorSpan.style.background = 'white';
          }
        } else {
          label.classList.remove('active');
          const cat = categories.find(c => c.id === catId);
          if (cat) {
            label.style.background = 'white';
            label.style.color = '#333';
            label.style.borderColor = '#ddd';
            colorSpan.style.background = cat.color;
          }
        }
      });

      // 展馆类型点击（单选）
      venueOptEl.addEventListener('click', e => {
        const btn = e.target.closest('button');
        if (!btn) return;
        venueOptEl.querySelectorAll('.venue-option').forEach(b => {
          b.classList.remove('active');
          b.style.background = '';
          b.style.color = '';
          b.style.borderColor = '';
        });
        btn.classList.add('active');
        const venueId = btn.dataset.venue;
        if (!venueId) {
          btn.style.background = '#666';
          btn.style.color = '#fff';
          btn.style.borderColor = '#666';
        } else {
          const venue = venueTypes.find(v => v.id === venueId);
          if (venue) {
            btn.style.background = venue.color;
            btn.style.color = '#fff';
            btn.style.borderColor = venue.color;
          }
        }
      });

      // 状态点击（单选）
      document.querySelectorAll('.status-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.status-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
        });
      });
    }

    async function saveAll() {
      const saveBtn = document.getElementById('save-btn');
      if (saveBtn) {
        saveBtn.disabled = true;
        saveBtn.textContent = '保存中...';
      }

      // 形式小类（多选）：所有勾选上的 checkbox
      const subCategories = [...document.querySelectorAll('.cat-option input[type=checkbox]:checked')]
        .map(cb => cb.dataset.cat);
      const venueType = document.querySelector('.venue-option.active')?.dataset.venue || '';
      const status = document.querySelector('.status-btn.active')?.dataset.status || 'pending';
      // My idea 输入：合并了标签和备注
      // 策略：第一行作为 tags（空格分隔），第二行开始作为 userNote
      const myIdeaText = (document.getElementById('my-idea-input')?.value || '').trim();
      let tags = [];
      let userNote = '';
      if (myIdeaText) {
        const lines = myIdeaText.split('\n');
        // 第一行拆出 tags
        tags = lines[0].trim().split(/\s+/).filter(Boolean);
        // 剩余行作为 userNote
        userNote = lines.slice(1).join('\n').trim();
      }

      // 按 source 分流处理
      const isLocal = insp.source === 'local' || insp.localPath;
      let localPath, urlForUpdate;
      if (isLocal) {
        // 硬盘图：只取 localPath
        localPath = (document.getElementById('local-path-input')?.value || '').trim();
        urlForUpdate = undefined;
      } else {
        // 线上图：只取 url
        const urlInputVal = (document.getElementById('url-input')?.value || '').trim();
        if (!urlInputVal) {
          urlForUpdate = '';
        } else {
          try {
            new URL(urlInputVal);
            urlForUpdate = urlInputVal;
          } catch {
            showToast('线上链接格式不对，请检查或清空');
            document.getElementById('url-input').focus();
            return;
          }
        }
      }

      // 检测是否修改了 AI 建议（用于触发学习）
      const oldSubCats = insp.aiSuggestion?.subCategories || (insp.aiSuggestion?.subCategory ? [insp.aiSuggestion.subCategory] : []);
      const newSubCats = subCategories;
      const subChanged = oldSubCats.length !== newSubCats.length || oldSubCats.some(s => !newSubCats.includes(s));
      const venueChanged = venueType !== (insp.aiSuggestion?.venueType || '');
      const learnFromCorrection = !!insp.aiSuggestion && (subChanged || venueChanged);

      const patch = {
        venueType: venueType || undefined,
        status,
        tags,
        userNote,
        // 硬盘图：传 localPath；线上图：传 url（都不会跨类型串）
        ...(isLocal ? { localPath: localPath || undefined } : { url: urlForUpdate === '' ? '' : (urlForUpdate || undefined) }),
        subCategories: subCategories,
      };

      try {
        const res = await API.updateInspiration(id, patch, learnFromCorrection);
        if (res.success) {
          showToast('✓ 已保存');
          setTimeout(() => location.href = '/inspirations', 800);
        } else {
          showToast('保存失败：' + (res.error || '未知错误'), 4000);
          if (saveBtn) {
            saveBtn.disabled = false;
            saveBtn.textContent = '✓ 保存';
          }
        }
      } catch (e) {
        showToast('保存失败：' + (e.message || '网络错误'), 4000);
        if (saveBtn) {
          saveBtn.disabled = false;
          saveBtn.textContent = '✓ 保存';
        }
      }
    }

    async function deleteInspiration() {
      if (!confirm('确定删除这条灵感？此操作不可恢复。')) return;
      try {
        await API.deleteInspirations([id]);
        showToast('已删除');
        setTimeout(() => location.href = '/inspirations', 500);
      } catch (e) {
        showToast('删除失败：' + (e.message || ''), 4000);
      }
    }

    async function rescrape() {
      showToast('重新抓取中...');
      try {
        const res = await API.rescrape(id);
        if (res.success) {
          insp = res.inspiration;
          render();
          showToast('已重新抓取');
        } else {
          showToast('抓取失败：' + (res.error || ''), 4000);
        }
      } catch (e) {
        showToast('抓取失败：' + (e.message || ''), 4000);
      }
    }

    async function reclassify() {
      showToast('AI 重新分类中...');
      try {
        const res = await API.reclassify(id);
        if (res.success) {
          insp = res.inspiration;
          render();
          showToast('AI 重新分类完成');
        } else {
          showToast('失败：' + (res.error || ''), 4000);
        }
      } catch (e) {
        showToast('失败：' + (e.message || ''), 4000);
      }
    }

    // 渲染 confirm 页的本地路径 tag + 一个独立的"编辑本地路径"行
    function renderConfirmLocalTag(localPath) {
      const safe = escapeHtml(localPath);
      return `<a class="tag tag-default tag-link"
                href="javascript:void(0)"
                onclick="event.stopPropagation(); handleRevealLocal('${safe.replace(/'/g, "\\'")}')"
                title="${safe}（点击在 Finder 中显示）"
                style="font-size: 12px;">
                💻 硬盘
              </a>`;
    }

    // 安全打开 URL（只允许 http/https）
    function openUrlSafe(url) {
      if (!url) return;
      try {
        const u = new URL(url);
        if (u.protocol === 'http:' || u.protocol === 'https:') {
          window.open(url, '_blank', 'noopener,noreferrer');
        } else {
          showToast('只支持 http(s) 链接');
        }
      } catch {
        showToast('链接格式不对');
      }
    }

    async function handleRevealLocal(localPath) {
      if (!localPath) return;
      const r = await API.revealLocalPath(localPath);
      if (r.ok) {
        showToast('✓ 已在 Finder 中显示', 2000);
        return;
      }
      try {
        await navigator.clipboard.writeText(localPath);
        showToast('本地服务未启动，路径已复制到剪贴板', 3000);
      } catch {
        showToast('本地服务未启动，路径：' + localPath, 5000);
      }
    }

    /** 标题保存后回调：同步到本地 state 并更新 page-title 副标题 */
    function onConfirmTitleSaved(id, newTitle) {
      if (insp && insp.id === id) insp.title = newTitle;
      document.title = `确认灵感 · ${newTitle || '无标题'}`;
    }
  </script>
</body>
</html>
